# Dependabot — PRs automáticos de actualización de dependencias.
# CodeQL analiza el código propio; NO cubre CVEs de dependencias. Esto sí.
# Docs: https://docs.github.com/code-security/dependabot
version: 2
updates:
  # ── Backend (raíz) ──
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Agrupar parches/minors en un solo PR reduce el ruido de revisión.
      backend-minor-patch:
        update-types:
          - minor
          - patch

  # ── Frontend ──
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  # ── GitHub Actions (los `uses:` de los workflows) ──
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
